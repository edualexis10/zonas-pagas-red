<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Videos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Conversor de Videos</h1>
    <p class="subtitle">Sube un video y conviértelo al formato que necesites (MP4, AVI, MOV, MKV, WEBM, GIF).</p>

    <form id="convert-form">
      <label class="dropzone" id="dropzone" for="video-input">
        <span id="file-label">Arrastra un video aquí o haz clic para elegirlo</span>
        <input type="file" id="video-input" name="video" accept="video/*" required hidden />
      </label>

      <label for="format-select">Formato de salida</label>
      <select id="format-select" name="format">
        <option value="mp4" selected>MP4</option>
        <option value="avi">AVI</option>
        <option value="mov">MOV</option>
        <option value="mkv">MKV</option>
        <option value="webm">WEBM</option>
        <option value="gif">GIF</option>
      </select>

      <button type="submit" id="submit-btn">Convertir</button>
    </form>

    <div id="status" class="status" hidden></div>
    <a id="download-link" class="download-link" hidden download>Descargar archivo convertido</a>

    <p class="subtitle"><a href="conteo.html">Ir al contador de pasajeros &rarr;</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
