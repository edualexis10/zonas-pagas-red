<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Videos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Conversor de Videos</h1>
    <p class="subtitle">Sube uno o varios videos, de cualquier tamaño, y conviértelos en paralelo al formato que necesites.</p>

    <form id="convert-form">
      <label class="dropzone" id="dropzone" for="video-input">
        <span id="file-label">Arrastra uno o varios videos aquí o haz clic para elegirlos</span>
        <input type="file" id="video-input" name="videos" accept="video/*" multiple hidden />
      </label>

      <label for="format-select">Formato de salida</label>
      <select id="format-select" name="format">
        <option value="mp4" selected>MP4</option>
        <option value="avi">AVI</option>
        <option value="mov">MOV</option>
        <option value="mkv">MKV</option>
        <option value="webm">WEBM</option>
        <option value="gif">GIF</option>
      </select>

      <button type="submit" id="submit-btn">Convertir</button>
    </form>

    <div id="status" class="status" hidden></div>
    <ul id="job-list" class="job-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
